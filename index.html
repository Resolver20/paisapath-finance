<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nivara is your calm, private personal-finance dashboard." />
    <title>Nivara — Private finance</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;background:#f7f6ff;color:#25213d;font-family:Arial,sans-serif;text-align:center;padding:24px">
        <section>
          <p style="letter-spacing:.15em;color:#7563b5;font-size:11px">NIVARA</p>
          <h1 style="font-family:Georgia,serif;font-size:42px;margin:12px 0">Loading your private space…</h1>
          <p id="boot-status" style="color:#6d6981">Starting your secure dashboard.</p>
        </section>
      </main>
    </div>
    <script>
      const bootStatus = document.getElementById('boot-status');
      window.addEventListener('error', (event) => { bootStatus.textContent = `Startup issue: ${event.message}`; });
      window.addEventListener('unhandledrejection', (event) => { bootStatus.textContent = `Startup issue: ${event.reason?.message || 'Unable to start the secure app.'}`; });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
